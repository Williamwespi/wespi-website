<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Wespi | Beeld, data en web{% endblock %}
    </title>

    <meta
        name="description"
        content="{% block meta_description %}Wespi helpt bedrijven met professionele productfotografie, beeldbewerking, data en slimme digitale processen.{% endblock %}"
    >

    {% block canonical %}
    <link
        rel="canonical"
        href="https://www.wespi.nl/"
    >
    {% endblock %}


    <!-- ========================================
         ALGEMENE STYLING
    ========================================= -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/basis.css') }}?v=1.3"
    >


    <!-- ========================================
         HEADER
    ========================================= -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/header.css') }}?v=1.3"
    >


    <!-- ========================================
         HOMEPAGE
    ========================================= -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/hero.css') }}?v=1.3"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/diensten.css') }}?v=1.3"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/voordelen.css') }}?v=1.3"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/projecten.css') }}?v=1.3"
    >


    <!-- ========================================
         KLEDINGFOTOGRAFIE
    ========================================= -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/kledingfotografie.css') }}?v=1.3"
    >


    <!-- ========================================
         BEELD
    ========================================= -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/beeld.css') }}?v=1.3"
    >


    <!-- ========================================
         PACKSHOTFOTOGRAFIE
    ========================================= -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/packshotfotografie/packshotfotografie.css') }}?v=1.0"
    >


    <!-- ========================================
         BEELDBEWERKING
    ========================================= -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/beeldbewerking/beeldbewerking.css') }}?v=1.0"
    >


    <!-- ========================================
         PRODUCTDATA
    ========================================= -->

    <!-- Hero -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/productdata/hero.css') }}?v=1.0"
    >

    <!-- USP-balk -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/productdata/usp-balk.css') }}?v=1.0"
    >

    <!-- Intro -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/productdata/intro.css') }}?v=1.0"
    >

    <!-- Werkwijze -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/productdata/werkwijze.css') }}?v=1.0"
    >

    <!-- Volume -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/productdata/volume.css') }}?v=1.0"
    >

    <!-- Prijzen -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/productdata/prijzen.css') }}?v=1.0"
    >

    <!-- Productdata Service -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/productdata/service.css') }}?v=1.0"
    >


    <!-- ========================================
         SLIMMER WERKEN
    ========================================= -->

    <!-- Hero -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/slimmer-werken/hero.css') }}?v=1.0"
    >

    <!-- Mogelijkheden -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/slimmer-werken/mogelijkheden.css') }}?v=1.0"
    >

    <!-- Prijzen -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/slimmer-werken/prijs.css') }}?v=1.0"
    >
<!-- Tussenblok -->
<link
    rel="stylesheet"
    href="{{ url_for('static', path='css/slimmer-werken/tussenblok.css') }}?v=1.0"
>
<!-- ========================================
     OVER WESPI
========================================= -->

<link
    rel="stylesheet"
    href="{{ url_for('static', path='css/over-wespi/over-wespi.css') }}?v=1.0"
>

    <!-- ========================================
         OFFERTE
    ========================================= -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/offerte.css') }}?v=1.3"
    >


    <!-- ========================================
         FOOTER + CONTACT CTA
    ========================================= -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/footer.css') }}?v=1.3"
    >

</head>


<body>

    {% include "onderdelen/header.html" %}


    <main>

        {% block content %}
        {% endblock %}

    </main>


    {% include "onderdelen/footer.html" %}


    <script
        src="{{ url_for('static', path='js/main.js') }}?v=1.3"
    ></script>

</body>

</html>
