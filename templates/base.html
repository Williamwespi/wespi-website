<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Wespi{% endblock %}
    </title>


    <!-- Algemene styling -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/basis.css') }}"
    >


    <!-- Header -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/header.css') }}"
    >


    <!-- Homepage onderdelen -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/hero.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/diensten.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/voordelen.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/projecten.css') }}"
    >


    <!-- Footer + contact CTA -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/footer.css') }}"
    >

</head>


<body>

    {% include "onderdelen/header.html" %}


    <main>

        {% block content %}
        {% endblock %}

    </main>


    {% include "onderdelen/footer.html" %}


    <script
        src="{{ url_for('static', path='js/main.js') }}"
    ></script>

</body>

</html>
